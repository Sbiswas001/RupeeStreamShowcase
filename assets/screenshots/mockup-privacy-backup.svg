<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E19"/>
      <stop offset="100%" stop-color="#0D1411"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="560" height="380" rx="24" fill="url(#bgGrad)" stroke="#1F3329" stroke-width="2"/>

  <!-- Left: User Device (Local-first) -->
  <g transform="translate(36, 40)" filter="url(#boxShadow)">
    <rect width="200" height="300" rx="20" fill="#18241F" stroke="#253D30" stroke-width="2"/>
    
    <!-- Phone header -->
    <rect x="20" y="20" width="160" height="28" rx="8" fill="#10B981" fill-opacity="0.12"/>
    <text x="100" y="38" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">LOCAL DEVICE</text>

    <!-- Internal Local Database -->
    <rect x="20" y="66" width="160" height="88" rx="12" fill="#101914" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="100" y="98" text-anchor="middle" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SQLite Database</text>
    <text x="100" y="118" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Stored &amp; processed locally</text>
    <text x="100" y="136" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Zero server logging</text>

    <!-- Encryption Engine -->
    <g transform="translate(20, 172)">
      <rect width="160" height="96" rx="12" fill="#132B20" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="34" cy="34" r="14" fill="#10B981" fill-opacity="0.25"/>
      <text x="34" y="39" text-anchor="middle" fill="#34D399" font-size="13">🔒</text>
      <text x="58" y="30" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AES-256-GCM</text>
      <text x="58" y="46" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10">Android Keystore</text>
      
      <rect x="14" y="62" width="132" height="22" rx="6" fill="#0A1811"/>
      <text x="80" y="77" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">Encrypted on-device</text>
    </g>
  </g>

  <!-- Center Arrow / Encryption pipeline -->
  <g transform="translate(250, 170)">
    <path d="M 0 20 L 44 20" stroke="url(#streamGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="44,14 56,20 44,26" fill="#34D399"/>
    <text x="28" y="8" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="9" font-weight="600">HTTPS TLS</text>
  </g>

  <!-- Right: Google Drive (Private appDataFolder) -->
  <g transform="translate(324, 40)" filter="url(#boxShadow)">
    <rect width="200" height="300" rx="20" fill="#18241F" stroke="#253D30" stroke-width="2"/>
    
    <!-- Cloud header -->
    <rect x="20" y="20" width="160" height="28" rx="8" fill="#10B981" fill-opacity="0.12"/>
    <text x="100" y="38" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">GOOGLE DRIVE</text>

    <!-- AppDataFolder isolated silo -->
    <rect x="20" y="66" width="160" height="136" rx="12" fill="#101914" stroke="#233B2E" stroke-width="1.5"/>
    
    <circle cx="100" cy="106" r="22" fill="#10B981" fill-opacity="0.15"/>
    <text x="100" y="113" text-anchor="middle" fill="#34D399" font-size="18">📁</text>
    
    <text x="100" y="146" text-anchor="middle" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">appDataFolder</text>
    <text x="100" y="164" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10">Isolated private space</text>
    <text x="100" y="180" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10">Encrypted backup file</text>

    <!-- Guarantee Box -->
    <g transform="translate(20, 218)">
      <rect width="160" height="50" rx="8" fill="#0E1713" stroke="#1F3329" stroke-width="1"/>
      <text x="80" y="22" text-anchor="middle" fill="#F87171" font-family="system-ui, sans-serif" font-size="9" font-weight="700">NO DRIVE ACCESS</text>
      <text x="80" y="38" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="9">Cannot read personal docs</text>
    </g>
  </g>
</svg>
