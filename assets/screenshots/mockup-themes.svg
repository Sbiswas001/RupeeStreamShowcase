<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="100%" height="100%">
  <defs>
    <!-- Phone Chassis Gradient with Gold / Emerald Tint -->
    <linearGradient id="phoneChassisThm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242218"/>
      <stop offset="50%" stop-color="#181510"/>
      <stop offset="100%" stop-color="#0c0b08"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBgThm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181714"/>
      <stop offset="100%" stop-color="#11100c"/>
    </linearGradient>

    <!-- Amber Glow -->
    <filter id="goldGlowThm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadowThm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone Outer Bezel -->
  <rect x="6" y="6" width="408" height="868" rx="46" fill="url(#phoneChassisThm)" stroke="#3b3524" stroke-width="4"/>
  
  <!-- Screen Inner Display -->
  <rect x="16" y="16" width="388" height="848" rx="38" fill="#0b0e13"/>

  <!-- Punch-hole Camera -->
  <circle cx="210" cy="34" r="6" fill="#000000"/>
  <circle cx="211" cy="33" r="2" fill="#17251e"/>

  <!-- Status Bar -->
  <text x="36" y="38" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">4:44</text>
  <text x="74" y="38" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">0 KB/s</text>
  <path d="M340 32a6 6 0 0 1 8 0 M336 29a12 12 0 0 1 16 0" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="366" y="28" width="18" height="10" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="368" y="30" width="12" height="6" rx="1.5" fill="#f59e0b"/>
  <path d="M385 31v4" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>

  <!-- App Header -->
  <g transform="translate(36, 64)" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="2" x2="18" y2="2"/>
    <line x1="0" y1="8" x2="18" y2="8"/>
    <line x1="0" y1="14" x2="18" y2="14"/>
  </g>
  <text x="70" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="20" font-weight="800">RupeeStream+</text>
  <!-- Crown / Premium Star Icon -->
  <g transform="translate(356, 66)">
    <polygon points="10,0 13,7 20,8 15,13 16,20 10,16 4,20 5,13 0,8 7,7" fill="#f59e0b" filter="url(#goldGlowThm)"/>
  </g>

  <!-- Tagline Subtitle -->
  <text x="36" y="112" fill="#7d8b96" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="600">Lifetime Entitlement · Personalization</text>

  <!-- CARD 1: Custom App Launcher Icons Suite -->
  <g transform="translate(32, 126)" filter="url(#cardShadowThm)">
    <rect width="356" height="152" rx="20" fill="url(#cardBgThm)" stroke="#2f2a1b" stroke-width="1"/>
    
    <text x="20" y="28" fill="#f59e0b" font-size="11" font-weight="800" letter-spacing="0.5">LAUNCHER ICONS</text>
    <text x="20" y="48" fill="#ffffff" font-size="14" font-weight="700">Choose Your Signature App Icon</text>

    <!-- 4 App Icons -->
    <g transform="translate(24, 64)">
      <!-- Icon 1: Emerald Mint (Active) -->
      <g transform="translate(0, 0)">
        <rect width="56" height="56" rx="16" fill="#0d291e" stroke="#10b981" stroke-width="2"/>
        <text x="28" y="36" text-anchor="middle" fill="#10b981" font-size="22" font-weight="800">₹</text>
        <circle cx="48" cy="8" r="6" fill="#10b981"/>
        <text x="28" y="72" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">Emerald</text>
      </g>

      <!-- Icon 2: Midnight Gold -->
      <g transform="translate(80, 0)">
        <rect width="56" height="56" rx="16" fill="#241e0b" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="28" y="36" text-anchor="middle" fill="#f59e0b" font-size="22" font-weight="800">₹</text>
        <text x="28" y="72" text-anchor="middle" fill="#8d9ea9" font-size="10">Gold</text>
      </g>

      <!-- Icon 3: Cyberpunk Violet -->
      <g transform="translate(160, 0)">
        <rect width="56" height="56" rx="16" fill="#1f1329" stroke="#a855f7" stroke-width="1.5"/>
        <text x="28" y="36" text-anchor="middle" fill="#a855f7" font-size="22" font-weight="800">₹</text>
        <text x="28" y="72" text-anchor="middle" fill="#8d9ea9" font-size="10">Violet</text>
      </g>

      <!-- Icon 4: Obsidian Stealth -->
      <g transform="translate(240, 0)">
        <rect width="56" height="56" rx="16" fill="#101412" stroke="#4b5851" stroke-width="1.5"/>
        <text x="28" y="36" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">₹</text>
        <text x="28" y="72" text-anchor="middle" fill="#8d9ea9" font-size="10">Obsidian</text>
      </g>
    </g>
  </g>

  <!-- CARD 2: Pro Features Trio (PDF Statements + Gyroscope Shield + Material You) -->
  <g transform="translate(32, 294)" filter="url(#cardShadowThm)">
    <rect width="356" height="286" rx="20" fill="url(#cardBgThm)" stroke="#2f2a1b" stroke-width="1"/>
    
    <text x="20" y="28" fill="#f59e0b" font-size="11" font-weight="800" letter-spacing="0.5">EXCLUSIVE CAPABILITIES</text>
    <text x="20" y="50" fill="#ffffff" font-size="15" font-weight="700">Advanced Engine Features</text>

    <!-- Feature 1: PDF Financial Statement Generator -->
    <g transform="translate(20, 68)">
      <rect width="40" height="40" rx="10" fill="#2d1719"/>
      <text x="20" y="26" text-anchor="middle" fill="#f43f5e" font-size="18">📄</text>
      <text x="52" y="18" fill="#ffffff" font-size="13" font-weight="700">PDF Financial Statements</text>
      <text x="52" y="34" fill="#8d9ea9" font-size="11">Generate professional, formatted reports on demand</text>
    </g>

    <!-- Feature 2: Gyroscope Privacy Shield (Shake-to-Hide) -->
    <g transform="translate(20, 126)">
      <rect width="40" height="40" rx="10" fill="#0d291e"/>
      <text x="20" y="26" text-anchor="middle" fill="#10b981" font-size="18">📳</text>
      <text x="52" y="18" fill="#ffffff" font-size="13" font-weight="700">Gyroscope Privacy Shield</text>
      <text x="52" y="34" fill="#8d9ea9" font-size="11">Shake device in public to instantly blur sensitive balances</text>
    </g>

    <!-- Feature 3: Dynamic Color (Material You) -->
    <g transform="translate(20, 184)">
      <rect width="40" height="40" rx="10" fill="#1f182e"/>
      <text x="20" y="26" text-anchor="middle" fill="#c084fc" font-size="18">🎨</text>
      <text x="52" y="18" fill="#ffffff" font-size="13" font-weight="700">Dynamic Color (Material You)</text>
      <text x="52" y="34" fill="#8d9ea9" font-size="11">UI harmonizes with your Android wallpaper palette</text>
    </g>

    <!-- Feature 4: Dashboard Card Reordering -->
    <g transform="translate(20, 240)">
      <rect width="40" height="34" rx="10" fill="#13232c"/>
      <text x="20" y="23" text-anchor="middle" fill="#38bdf8" font-size="16">🎛️</text>
      <text x="52" y="15" fill="#ffffff" font-size="13" font-weight="700">Dashboard Customization</text>
      <text x="52" y="31" fill="#8d9ea9" font-size="11">Reorder, pin, or hide financial summary cards</text>
    </g>
  </g>

  <!-- CARD 3: Android Home Screen Widget Preview -->
  <g transform="translate(32, 596)" filter="url(#cardShadowThm)">
    <rect width="356" height="136" rx="20" fill="url(#cardBgThm)" stroke="#2f2a1b" stroke-width="1"/>
    
    <text x="20" y="24" fill="#f59e0b" font-size="11" font-weight="800" letter-spacing="0.5">HOME SCREEN WIDGET</text>
    
    <!-- Mini Widget Frame -->
    <g transform="translate(20, 36)">
      <rect width="316" height="84" rx="16" fill="#1b1c1e" stroke="#2f3439" stroke-width="1"/>
      <path d="M 16 20 l 4 -2.5 l 4 2.5 v 4 c 0 3 -2.5 5 -4 6 c -1.5 -1 -4 -3 -4 -6 z" fill="#00d09c"/>
      <text x="32" y="24" fill="#00d09c" font-size="11" font-weight="800">SAFE TO SPEND</text>
      <text x="300" y="24" text-anchor="end" fill="#8d9ea9" font-size="10">Sept 23</text>
      
      <text x="16" y="58" fill="#ffffff" font-size="22" font-weight="800">₹22,223.98</text>
      <text x="16" y="74" fill="#00d09c" font-size="10" font-weight="600">✓ On track · 8 days left in month</text>

      <!-- Quick Add (+) on widget -->
      <circle cx="286" cy="56" r="14" fill="#00d09c"/>
      <path d="M281 56 h10 M286 51 v10" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(16, 764)">
    <rect width="388" height="66" fill="#0d1318" stroke="#1a252f" stroke-width="1"/>
    <g transform="translate(56, 24)" fill="#687884">
      <path d="M0 8 L10 0 L20 8 V18 H13 V12 H7 V18 H0 Z"/>
      <text x="10" y="28" text-anchor="middle" font-size="9">Home</text>
    </g>
    <g transform="translate(148, 24)" fill="#687884">
      <path d="M2 18 V10 H6 V18 Z M8 18 V4 H12 V18 Z M14 18 V12 H18 V18 Z"/>
      <text x="10" y="28" text-anchor="middle" font-size="9">Insights</text>
    </g>
    <g transform="translate(240, 24)" fill="#687884">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#687884" stroke-width="2"/>
      <text x="10" y="28" text-anchor="middle" font-size="9">Budgets</text>
    </g>
    <g transform="translate(330, 24)" fill="#f59e0b">
      <polygon points="10,0 13,7 20,8 15,13 16,20 10,16 4,20 5,13 0,8 7,7" fill="#f59e0b"/>
      <text x="10" y="28" text-anchor="middle" font-size="9" font-weight="700">Plus</text>
    </g>
  </g>
</svg>
