<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Phone Chassis -->
    <linearGradient id="phoneChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2924"/>
      <stop offset="50%" stop-color="#121815"/>
      <stop offset="100%" stop-color="#0a0f0d"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c22"/>
      <stop offset="100%" stop-color="#0e141a"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone Outer Bezel -->
  <rect x="6" y="6" width="408" height="868" rx="46" fill="url(#phoneChassis)" stroke="#2b3b32" stroke-width="4"/>
  
  <!-- Screen Inner Display -->
  <rect x="16" y="16" width="388" height="848" rx="38" fill="#0b0e13"/>

  <!-- Punch-hole Camera -->
  <circle cx="210" cy="34" r="6" fill="#000000"/>
  <circle cx="211" cy="33" r="2" fill="#17251e"/>

  <!-- Status Bar -->
  <text x="36" y="38" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">4:44</text>
  <text x="74" y="38" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">0 KB/s</text>
  <!-- WiFi / Signal / Battery Icons (SVG paths) -->
  <path d="M340 32a6 6 0 0 1 8 0 M336 29a12 12 0 0 1 16 0" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="366" y="28" width="18" height="10" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="368" y="30" width="9" height="6" rx="1.5" fill="#10b981"/>
  <path d="M385 31v4" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>

  <!-- App Header -->
  <!-- Hamburger Menu Icon -->
  <g transform="translate(36, 64)" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="2" x2="18" y2="2"/>
    <line x1="0" y1="8" x2="18" y2="8"/>
    <line x1="0" y1="14" x2="18" y2="14"/>
  </g>
  <!-- App Title -->
  <text x="70" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.4">RupeeStream</text>
  <!-- Star & Search Icons -->
  <g transform="translate(316, 66)">
    <!-- Star Icon (Teal) -->
    <path d="M12 2l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 8.9 9.1 8z" fill="#00d09c"/>
    <!-- Search Icon -->
    <path d="M42 9a6 6 0 1 1-12 0 6 6 0 0 1 12 0zm-1.8 4.2L45 18" fill="none" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tagline Row: See Beyond the Balance -->
  <text x="36" y="112" fill="#7d8b96" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="600">See Beyond the Balance</text>
  <!-- Sliders / Filter Icon -->
  <g transform="translate(366, 102)" stroke="#7d8b96" stroke-width="1.6" stroke-linecap="round">
    <line x1="0" y1="2" x2="14" y2="2"/><circle cx="4" cy="2" r="1.5" fill="#7d8b96"/>
    <line x1="0" y1="7" x2="14" y2="7"/><circle cx="10" cy="7" r="1.5" fill="#7d8b96"/>
    <line x1="0" y1="12" x2="14" y2="12"/><circle cx="6" cy="12" r="1.5" fill="#7d8b96"/>
  </g>

  <!-- CARD 1: Net Worth Card -->
  <g transform="translate(32, 126)" filter="url(#cardShadow)">
    <rect width="356" height="136" rx="20" fill="url(#cardBg)" stroke="#1a252f" stroke-width="1"/>
    
    <text x="20" y="28" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="500">Net worth · September</text>
    <text x="20" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">₹6,76,453.00</text>
    
    <!-- Neon Emerald Sparkline -->
    <path d="M 20 98 Q 50 98 75 97 Q 85 96 90 74 Q 96 70 102 75 Q 120 78 180 80 Q 230 83 250 78 Q 280 78 336 82" fill="none" stroke="#00d09c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>

    <!-- Pill: -6.0% this month -->
    <rect x="20" y="108" width="186" height="22" rx="11" fill="#0c2321"/>
    <path d="M28 119l4 4 6-6" fill="none" stroke="#00d09c" stroke-width="1.8" stroke-linecap="round"/>
    <text x="44" y="123" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="11" font-weight="700">₹43,211.00 (-6.0%) this month</text>
  </g>

  <!-- CARD 2: Safe to Spend Today Card -->
  <g transform="translate(32, 276)" filter="url(#cardShadow)">
    <rect width="356" height="158" rx="20" fill="url(#cardBg)" stroke="#1a252f" stroke-width="1"/>
    
    <!-- Header: Shield + SAFE TO SPEND TODAY + Info (?) -->
    <path d="M 20 22 l 5 -3 l 5 3 v 5 c 0 4 -3 7 -5 8 c -2 -1 -5 -4 -5 -8 z" fill="#00d09c"/>
    <text x="38" y="27" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">SAFE TO SPEND TODAY</text>
    <circle cx="334" cy="23" r="7" fill="none" stroke="#687884" stroke-width="1.4"/>
    <text x="334" y="27" text-anchor="middle" fill="#687884" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">?</text>

    <!-- Main Safe Amount -->
    <text x="20" y="68" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">₹22,223.98</text>

    <!-- Right Stat: vs 7-day avg with mini sparkline -->
    <text x="338" y="48" text-anchor="end" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10" font-weight="600">↑ ₹6,013.56 vs 7-day avg</text>
    <!-- Dotted trend line with glowing end dot -->
    <path d="M250 68 Q270 65 290 64 T328 58" fill="none" stroke="#00d09c" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="328" cy="58" r="3.5" fill="#ffffff" stroke="#00d09c" stroke-width="2"/>

    <!-- Discretionary Subtext -->
    <text x="20" y="96" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="13" font-weight="700">₹1,77,791.82 <tspan fill="#8d9ea9" font-weight="400">discretionary</tspan></text>
    <text x="338" y="96" text-anchor="end" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="11" font-weight="700">· 8 days left</text>

    <!-- Bottom Status Banner Pill -->
    <rect x="14" y="112" width="328" height="32" rx="16" fill="#0d2b24"/>
    <circle cx="34" cy="128" r="6" fill="#00d09c"/>
    <path d="M31 128l2 2 4-4" fill="none" stroke="#0b0e13" stroke-width="1.6" stroke-linecap="round"/>
    <text x="46" y="132" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="700">On track to make your money last</text>
  </g>

  <!-- SECTION: This Month -->
  <text x="36" y="462" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="17" font-weight="800">This Month</text>

  <!-- CARD 3: Income & Spending Breakdown -->
  <g transform="translate(32, 476)" filter="url(#cardShadow)">
    <rect width="356" height="122" rx="20" fill="url(#cardBg)" stroke="#1a252f" stroke-width="1"/>
    
    <!-- Income Col -->
    <circle cx="30" cy="24" r="8" fill="#0c2321"/>
    <text x="30" y="27" text-anchor="middle" fill="#00d09c" font-size="11">↑</text>
    <text x="44" y="28" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="600">Income</text>
    <text x="20" y="56" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="20" font-weight="800">+₹ 1,40,000.00</text>

    <!-- Spending Col -->
    <circle cx="194" cy="24" r="8" fill="#2d1719"/>
    <text x="194" y="27" text-anchor="middle" fill="#f87171" font-size="11">↓</text>
    <text x="208" y="28" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="600">Spending</text>
    <text x="184" y="56" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="20" font-weight="800">-₹ 58,211.00</text>

    <!-- Net Cash Flow Row -->
    <line x1="20" y1="74" x2="336" y2="74" stroke="#16202a" stroke-width="1"/>
    <text x="20" y="100" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="13" font-weight="600">Net Cash Flow</text>
    <text x="336" y="100" text-anchor="end" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="16" font-weight="800">+₹ 81,789.00</text>
  </g>

  <!-- TWO SPLIT CARDS: Last Activity & Next Upcoming -->
  <g transform="translate(32, 614)">
    <!-- Left Card: Last Activity -->
    <g filter="url(#cardShadow)">
      <rect width="172" height="88" rx="16" fill="url(#cardBg)" stroke="#1a252f" stroke-width="1"/>
      <text x="14" y="22" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">LAST ACTIVITY</text>
      <circle cx="154" cy="18" r="6" fill="none" stroke="#00d09c" stroke-width="1.2"/>
      
      <text x="14" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="700">Local Coffee &amp; Evenin...</text>
      <text x="14" y="60" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10">Food &amp; Dining</text>
      <text x="14" y="78" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="13" font-weight="800">-₹650.00</text>
    </g>

    <!-- Right Card: Next Upcoming -->
    <g transform="translate(184, 0)" filter="url(#cardShadow)">
      <rect width="172" height="88" rx="16" fill="url(#cardBg)" stroke="#1a252f" stroke-width="1"/>
      <text x="14" y="22" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">NEXT UPCOMING</text>
      <rect x="148" y="14" width="10" height="10" rx="2" fill="none" stroke="#00d09c" stroke-width="1.2"/>
      <text x="14" y="52" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="11">No upcoming bills</text>
    </g>
  </g>

  <!-- Floating Action Button (FAB) -->
  <g transform="translate(328, 672)" filter="url(#cardShadow)">
    <circle cx="26" cy="26" r="26" fill="#00d09c"/>
    <line x1="26" y1="16" x2="26" y2="36" stroke="#0b0e13" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="26" x2="36" y2="26" stroke="#0b0e13" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(24, 756)">
    <rect width="372" height="64" rx="20" fill="#0b0f14"/>

    <!-- Dashboard Pill (Active) -->
    <rect x="12" y="10" width="56" height="32" rx="16" fill="#00d09c"/>
    <!-- 4 Squares Grid Icon -->
    <g transform="translate(34, 18)" fill="#0b0e13">
      <rect x="-6" y="-1" width="5" height="5" rx="1"/>
      <rect x="1" y="-1" width="5" height="5" rx="1"/>
      <rect x="-6" y="6" width="5" height="5" rx="1"/>
      <rect x="1" y="6" width="5" height="5" rx="1"/>
    </g>
    <text x="40" y="54" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="10" font-weight="700">Dashboard</text>

    <!-- Nav 2: Receipt / Transactions -->
    <g transform="translate(132, 24)" stroke="#9ca3af" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="14" height="18" rx="2"/>
      <line x1="3" y1="5" x2="11" y2="5"/>
      <line x1="3" y1="9" x2="11" y2="9"/>
      <line x1="3" y1="13" x2="8" y2="13"/>
    </g>

    <!-- Nav 3: Insights Sparkline Chart -->
    <g transform="translate(224, 24)" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M0 14l5-6 4 4 6-10"/>
      <circle cx="15" cy="2" r="1.5" fill="#9ca3af"/>
    </g>

    <!-- Nav 4: Accounts Bank Icon -->
    <g transform="translate(316, 24)" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M1 6l8-4 8 4"/>
      <line x1="2" y1="7" x2="16" y2="7"/>
      <line x1="4" y1="8" x2="4" y2="16"/>
      <line x1="9" y1="8" x2="9" y2="16"/>
      <line x1="14" y1="8" x2="14" y2="16"/>
      <line x1="1" y1="16" x2="17" y2="16"/>
    </g>
  </g>

  <!-- Android Navigation Bar (||| O <) -->
  <g transform="translate(140, 836)" stroke="#6b7280" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Recents ||| -->
    <line x1="-50" y1="0" x2="-50" y2="14"/>
    <line x1="-44" y1="0" x2="-44" y2="14"/>
    <line x1="-38" y1="0" x2="-38" y2="14"/>
    <!-- Home Circle -->
    <circle cx="70" cy="7" r="6"/>
    <!-- Back Arrow < -->
    <path d="M185 2l-7 5 7 5"/>
  </g>
</svg>
