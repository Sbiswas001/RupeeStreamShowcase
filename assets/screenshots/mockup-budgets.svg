<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneChassisBud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2924"/>
      <stop offset="50%" stop-color="#121815"/>
      <stop offset="100%" stop-color="#0a0f0d"/>
    </linearGradient>
    <linearGradient id="cardBgBud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c22"/>
      <stop offset="100%" stop-color="#0e141a"/>
    </linearGradient>
    <filter id="emeraldGlowBud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadowBud" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone Outer Bezel -->
  <rect x="6" y="6" width="408" height="868" rx="46" fill="url(#phoneChassisBud)" stroke="#2b3b32" stroke-width="4"/>
  
  <!-- Screen Inner Display -->
  <rect x="16" y="16" width="388" height="848" rx="38" fill="#0b0e13"/>

  <!-- Punch-hole Camera -->
  <circle cx="210" cy="34" r="6" fill="#000000"/>
  <circle cx="211" cy="33" r="2" fill="#17251e"/>

  <!-- Status Bar -->
  <text x="36" y="38" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">4:44</text>
  <text x="74" y="38" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">0 KB/s</text>
  <path d="M340 32a6 6 0 0 1 8 0 M336 29a12 12 0 0 1 16 0" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="366" y="28" width="18" height="10" rx="3" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="368" y="30" width="12" height="6" rx="1.5" fill="#10b981"/>
  <path d="M385 31v4" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>

  <!-- App Header -->
  <g transform="translate(36, 64)" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="2" x2="18" y2="2"/>
    <line x1="0" y1="8" x2="18" y2="8"/>
    <line x1="0" y1="14" x2="18" y2="14"/>
  </g>
  <text x="70" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="20" font-weight="800">Budgets &amp; Planning</text>
  <!-- Plus Icon -->
  <g transform="translate(356, 68)" stroke="#00d09c" stroke-width="2" stroke-linecap="round">
    <circle cx="8" cy="8" r="9" fill="none" stroke="#00d09c" stroke-width="1.5"/>
    <line x1="8" y1="4" x2="8" y2="12"/>
    <line x1="4" y1="8" x2="12" y2="8"/>
  </g>

  <!-- Tagline Subtitle -->
  <text x="36" y="112" fill="#7d8b96" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12" font-weight="600">Smart Discipline · Safe-to-Spend</text>

  <!-- CARD 1: Safe to Spend Today Highlight -->
  <g transform="translate(32, 126)" filter="url(#cardShadowBud)">
    <rect width="356" height="166" rx="20" fill="url(#cardBgBud)" stroke="#1a252f" stroke-width="1"/>
    
    <!-- Shield Icon & Pill -->
    <path d="M 22 22 l 5 -3 l 5 3 v 5 c 0 4 -3 7 -5 8 c -2 -1 -5 -4 -5 -8 z" fill="#00d09c"/>
    <text x="40" y="27" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">SAFE-TO-SPEND TODAY</text>
    <rect x="238" y="16" width="98" height="20" rx="10" fill="#0c2321"/>
    <text x="287" y="30" text-anchor="middle" fill="#00d09c" font-size="10" font-weight="700">8 Days Left</text>

    <!-- Main Dynamic Allowance -->
    <text x="22" y="70" fill="#00d09c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">₹22,223.98</text>
    <text x="22" y="96" fill="#8d9ea9" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="12">Total Pool: <tspan fill="#ffffff" font-weight="700">₹1,77,791.82</tspan> discretionary</text>

    <!-- Micro-stat row -->
    <line x1="22" y1="112" x2="334" y2="112" stroke="#16202a" stroke-width="1"/>
    <text x="22" y="132" fill="#8d9ea9" font-size="11">Daily burn rate: ₹3,840 avg</text>
    <text x="334" y="132" text-anchor="end" fill="#00d09c" font-size="11" font-weight="700">✓ On Track (Surplus)</text>

    <!-- 100% Offline Pill -->
    <rect x="22" y="142" width="168" height="16" rx="8" fill="#13231c"/>
    <text x="106" y="153" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">⚡ 100% Offline Calculation</text>
  </g>

  <!-- CARD 2: Active Monthly Category Budgets -->
  <g transform="translate(32, 308)" filter="url(#cardShadowBud)">
    <rect width="356" height="264" rx="20" fill="url(#cardBgBud)" stroke="#1a252f" stroke-width="1"/>
    
    <text x="20" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="16" font-weight="700">Active Monthly Budgets</text>
    <text x="336" y="30" text-anchor="end" fill="#00d09c" font-size="12" font-weight="600">3 of 5 under limit</text>

    <!-- Budget Item 1: Groceries -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="700">Groceries &amp; Pantry</text>
      <text x="316" y="14" text-anchor="end" fill="#8d9ea9" font-size="12">₹19,800 / <tspan fill="#ffffff">₹25,000</tspan></text>
      <!-- Progress Bar (79%) -->
      <rect x="0" y="24" width="316" height="8" rx="4" fill="#1b252f"/>
      <rect x="0" y="24" width="250" height="8" rx="4" fill="#00d09c" filter="url(#emeraldGlowBud)"/>
      <text x="0" y="46" fill="#8d9ea9" font-size="10">₹5,200 remaining · 79% spent</text>
      <text x="316" y="46" text-anchor="end" fill="#00d09c" font-size="10" font-weight="700">Healthy</text>
    </g>

    <!-- Budget Item 2: Dining & Takeaway -->
    <g transform="translate(20, 114)">
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="700">Dining &amp; Cafes</text>
      <text x="316" y="14" text-anchor="end" fill="#8d9ea9" font-size="12">₹10,500 / <tspan fill="#ffffff">₹12,000</tspan></text>
      <!-- Progress Bar (87% - Yellow) -->
      <rect x="0" y="24" width="316" height="8" rx="4" fill="#1b252f"/>
      <rect x="0" y="24" width="275" height="8" rx="4" fill="#f59e0b"/>
      <text x="0" y="46" fill="#8d9ea9" font-size="10">₹1,500 remaining · 87% spent</text>
      <text x="316" y="46" text-anchor="end" fill="#f59e0b" font-size="10" font-weight="700">Approaching Cap</text>
    </g>

    <!-- Budget Item 3: Entertainment -->
    <g transform="translate(20, 178)">
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="700">Entertainment &amp; Outings</text>
      <text x="316" y="14" text-anchor="end" fill="#8d9ea9" font-size="12">₹4,200 / <tspan fill="#ffffff">₹8,000</tspan></text>
      <!-- Progress Bar (52% - Blue) -->
      <rect x="0" y="24" width="316" height="8" rx="4" fill="#1b252f"/>
      <rect x="0" y="24" width="164" height="8" rx="4" fill="#38bdf8"/>
      <text x="0" y="46" fill="#8d9ea9" font-size="10">₹3,800 remaining · 52% spent</text>
      <text x="316" y="46" text-anchor="end" fill="#38bdf8" font-size="10" font-weight="700">Well Within Target</text>
    </g>
  </g>

  <!-- CARD 3: Recurring Bills & Reminders -->
  <g transform="translate(32, 588)" filter="url(#cardShadowBud)">
    <rect width="356" height="140" rx="20" fill="url(#cardBgBud)" stroke="#1a252f" stroke-width="1"/>
    <text x="20" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" font-size="15" font-weight="700">Upcoming Bills (Local Alarms)</text>
    
    <!-- Bill 1 -->
    <g transform="translate(20, 42)">
      <circle cx="10" cy="12" r="10" fill="#1e1b2e"/>
      <text x="10" y="16" text-anchor="middle" fill="#a855f7" font-size="10">⚡</text>
      <text x="28" y="14" fill="#ffffff" font-size="12" font-weight="600">Electricity &amp; Internet</text>
      <text x="28" y="28" fill="#8d9ea9" font-size="10">Due in 3 days · Sept 28</text>
      <text x="316" y="20" text-anchor="end" fill="#f87171" font-size="13" font-weight="700">₹3,200</text>
    </g>

    <!-- Bill 2 -->
    <g transform="translate(20, 84)">
      <circle cx="10" cy="12" r="10" fill="#2d1719"/>
      <text x="10" y="16" text-anchor="middle" fill="#f43f5e" font-size="10">🎬</text>
      <text x="28" y="14" fill="#ffffff" font-size="12" font-weight="600">Cloud &amp; Media Subscriptions</text>
      <text x="28" y="28" fill="#8d9ea9" font-size="10">Due in 5 days · Sept 30</text>
      <text x="316" y="20" text-anchor="end" fill="#f87171" font-size="13" font-weight="700">₹1,199</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(16, 764)">
    <rect width="388" height="66" fill="#0d1318" stroke="#1a252f" stroke-width="1"/>
    <g transform="translate(56, 24)" fill="#687884">
      <path d="M0 8 L10 0 L20 8 V18 H13 V12 H7 V18 H0 Z"/>
      <text x="10" y="28" text-anchor="middle" font-size="9">Home</text>
    </g>
    <g transform="translate(148, 24)" fill="#687884">
      <path d="M2 18 V10 H6 V18 Z M8 18 V4 H12 V18 Z M14 18 V12 H18 V18 Z"/>
      <text x="10" y="28" text-anchor="middle" font-size="9">Insights</text>
    </g>
    <g transform="translate(240, 24)" fill="#00d09c">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#00d09c" stroke-width="2"/>
      <circle cx="10" cy="10" r="3" fill="#00d09c"/>
      <text x="10" y="28" text-anchor="middle" font-size="9" font-weight="700">Budgets</text>
    </g>
    <g transform="translate(330, 24)" fill="#687884">
      <circle cx="10" cy="10" r="5" fill="none" stroke="#687884" stroke-width="2"/>
      <text x="10" y="28" text-anchor="middle" font-size="9">Settings</text>
    </g>
  </g>
</svg>
