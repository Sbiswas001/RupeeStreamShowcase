<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle / shield contour -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#shieldBg)" stroke="#10B981" stroke-width="8" stroke-opacity="0.3" />

  <!-- Protective Inner Shield Contour -->
  <path d="M 256 96 C 330 96 384 120 384 120 L 384 250 C 384 330 326 390 256 416 C 186 390 128 330 128 250 L 128 120 C 128 120 182 96 256 96 Z"
        fill="none" stroke="#10B981" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="0.4"/>

  <!-- Fluid Rupee Symbol with Stream Motion -->
  <!-- Top Horizontal Bar -->
  <path d="M 190 170 H 322" stroke="url(#streamGrad)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Second Horizontal Bar -->
  <path d="M 190 216 H 296" stroke="url(#streamGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Stem and Arc curving into dynamic forward stream -->
  <path d="M 230 170 V 262 C 230 292 284 292 284 262 C 284 226 230 226 230 226" 
        fill="none" stroke="url(#streamGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Stream / Downward Leg flowing outward -->
  <path d="M 238 278 L 324 366" 
        stroke="url(#streamGrad)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Subtle Glowing Accent Dot -->
  <circle cx="346" cy="388" r="10" fill="#34D399" filter="url(#glow)" />
</svg>
